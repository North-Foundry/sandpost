[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/North-Foundry/sandpost"

[workspace.dependencies]
sandpost-core = { path = "crates/sandpost-core" }
sandpost-query = { path = "crates/sandpost-query" }
sandpost-mime = { path = "crates/sandpost-mime" }
sandpost-smtp = { path = "crates/sandpost-smtp" }
sandpost-imap = { path = "crates/sandpost-imap" }
sandpost-storage = { path = "crates/sandpost-storage" }
sandpost-storage-sqlite = { path = "crates/sandpost-storage-sqlite" }
sandpost-storage-conformance = { path = "crates/sandpost-storage-conformance" }
sandpost-web-api = { path = "crates/sandpost-web-api" }
sandpost-application = { path = "crates/sandpost-application" }
sandpost-search = { path = "crates/sandpost-search" }
sandpost-html-check = { path = "crates/sandpost-html-check" }
sandpost-link-check = { path = "crates/sandpost-link-check" }
sandpost-persona-script = { path = "crates/sandpost-persona-script" }
sandpost-smtp-outbound = { path = "crates/sandpost-smtp-outbound" }
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
async-trait = "0.1"
dirs = "7"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
mail-parser = "0.11"
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
scraper = { version = "0.27", default-features = false }
cssparser = "0.38"
indexmap = { version = "2", features = ["serde"] }
url = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring"] }
ring = "0.17"

[profile.release]
lto = "thin"
strip = true
