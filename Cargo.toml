[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/North-Foundry/sandpost"

[workspace.dependencies]
sandpost-core = { path = "crates/sandpost-core" }
sandpost-query = { path = "crates/sandpost-query" }
sandpost-mime = { path = "crates/sandpost-mime" }
sandpost-smtp = { path = "crates/sandpost-smtp" }
sandpost-imap = { path = "crates/sandpost-imap" }
sandpost-storage = { path = "crates/sandpost-storage" }
sandpost-storage-sqlite = { path = "crates/sandpost-storage-sqlite" }
sandpost-storage-conformance = { path = "crates/sandpost-storage-conformance" }
sandpost-web-api = { path = "crates/sandpost-web-api" }
sandpost-application = { path = "crates/sandpost-application" }
sandpost-search = { path = "crates/sandpost-search" }
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
async-trait = "0.1"
dirs = "7"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
mail-parser = "0.11"
sha2 = "0.11"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
