[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/North-Foundry/sandpost"

[workspace.dependencies]
sandpost-core = { path = "crates/sandpost-core" }
sandpost-query = { path = "crates/sandpost-query" }
sandpost-match = { path = "crates/sandpost-match" }
sandpost-mail = { path = "crates/sandpost-mail" }
sandpost-storage = { path = "crates/sandpost-storage" }
sandpost-auth = { path = "crates/sandpost-auth" }
sandpost-api = { path = "crates/sandpost-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.40", features = ["bundled"] }
mail-parser = "0.11"
sha2 = "0.10"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
