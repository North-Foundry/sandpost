[package]
name = "sandpost-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sandpost = { path = "../sandpost" }
sandpost-application.workspace = true
sandpost-core.workspace = true
sandpost-storage.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt", "serde-json", "dyn-symbols"] }
napi-derive = "3"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
napi-build = "2"

[dev-dependencies]
sandpost-storage-sqlite.workspace = true
